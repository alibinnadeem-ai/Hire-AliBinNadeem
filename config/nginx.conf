# Nginx — consultant.alibinnadeem.com (Consultant)
# Location: /etc/nginx/sites-available/abn-consultant

limit_req_zone $binary_remote_addr zone=api_con:10m    rate=10r/s;
limit_req_zone $binary_remote_addr zone=contact_con:5m rate=1r/m;

server {
    listen 80;
    server_name consultant.alibinnadeem.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name consultant.alibinnadeem.com;

    ssl_certificate      /etc/letsencrypt/live/consultant.alibinnadeem.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/consultant.alibinnadeem.com/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    root /var/www/abn-consultant/frontend;

    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/contact {
        limit_req zone=contact_con burst=2 nodelay;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/proxy_params;
    }

    location /api/enquiry {
        limit_req zone=contact_con burst=2 nodelay;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=api_con burst=20 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(env|git|htaccess) { deny all; return 404; }

    access_log /var/log/nginx/abn-consultant-access.log;
    error_log  /var/log/nginx/abn-consultant-error.log;
}
